<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An's Music Player</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="tabs_container">
        <nav class="tabs">
            <a href="./index.html" class="active">Songs</a>
            <a href="./videos.html" aria-current="page">Videos</a>
        </nav>
    </div>

    <audio src="" id="audio"></audio>

    <div class="music_player">
        <div class="player_heading">
            <div class="decorate_circles">+</div>
            <h1 id="title">An's Music Player</h1>
            <div class="decorate_circles">+</div>
        </div>
        
        <h1 class="music_name">Name</h1>
        <p class="artist">artist</p>

        <div class="music_player_screen">
            <div class="disk"></div>
        </div>
        

        
        <div class="slider">
            <div class="bug_hider_bg">
                <div class="bug_hider"></div>
            </div>
            <input type="range" class="time_bar">
            <span class="current_time">00:00</span>
            <span class="song_time">00:00</span>
        </div>

        <div class="controls">
            <button class="button backward_button">←</button>
            <input type="checkbox" class="play_toggle" id="play_toggle">
            <label for="play_toggle" class="play_button"></label>

            <button class="button forward_button">→</button>
            <button class="button loop_button" type="button" aria-label="Repeat song" aria-pressed="false">
                <img src="./icons/loop-removebg-preview.png" alt="" style="height: 20px;">
            </button>
        </div>
        <div class="player_heading">
            <div class="decorate_circles bottom_circles">+</div>
            <div class="decorate_circles bottom_circles">+</div>
        </div>
    </div>

    <div class="song_picker">Playlist
        <button class="cassette_button" aria-expanded="false" aria-controls="song_list">
            <img src="./icons/palee-removebg-preview.png" alt="">
        </button>

        <div id="song_list" class="song_list" hidden></div>
    </div>

    <script src="./js/song.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
