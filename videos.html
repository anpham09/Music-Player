<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An's Videos Storage</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/videos.css">
</head>
<body>
    <div class="tabs_container">
        <nav class="tabs">
            <a href="./index.html">Songs</a>
            <a href="./videos.html" class="active" aria-current="page">Videos</a>
        </nav>
    </div>

    <details class="favorite_picker song_picker">
        <summary class="cassette_button">Favorites
            <img src="./icons/palee-removebg-preview.png" alt="">
        </summary>

        <div class="favorite_panel">
            <h2>My Favorites</h2>
            <div class="favorite_list"></div>
        </div>
    </details>

    <div class="videos_page">
        <div class="heading">
            <span class="decorate_circles videos_top_circles">+</span>
            <h1>An's Videos</h1>
            <span class="decorate_circles videos_top_circles">+</span>
        </div>
        <div class="video_screen" hidden>
            <h2 class="playing_title"></h2>

            <button class="mini_button" type="button" aria-pressed="false">Mini Screen</button>
            <iframe width="560" height="315" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
            </iframe>

        </div>
        <h2>Watch Later</h2>
        <p class="empty_message">No videos yet. Add one below!</p>
        <div class="watch_list"></div>

        <form action="" class="add_video">
            <label for="video_link">Something to watch later?</label>
            
            <div class="input_row">
                <input type="url" id="video_link"
                placeholder="Paste a YouTube link" required>
                <button type="submit">Add</button>
            </div>
        </form>

        <div class="upload_video">
            <label for="video_file">Or choose your own video:</label>
            <input type="file" id="video_file" accept="video/*">

            <div class="local_player" hidden>
                <video class="local_video" controls playsinline></video>

                <button class="pip_button" type="button">Pic in pic</button>
            </div>
            <p class="upload_message" role="status"></p>
        </div>
        
        <p class="message" role="status"></p>
    </div>

    <template id="video_card">
        <div class="video_card">
            <button class="watch_video" type="button">
                <img src="" alt="">
                <span class="video_title"></span>
            </button>

            <div class="video_actions">
                <button class="save_favorite" type="button">Favorite</button>
                <button class="remove_video" type="button">Remove</button>

            </div>
        </div>
        
    </template>
    

    <script src="./js/videos.js"></script>

</body>
</html>
